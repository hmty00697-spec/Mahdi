name: Build Glow Ball APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build

      - name: Clone python-for-android
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git p4a

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./p4a

      - name: Build APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --bootstrap=sdl2 \
            --requirements=python3,pygame-ce \
            --private=. \
            --package=org.glowball.game \
            --name="Glow Ball" \
            --version=1.0 \
            --arch=arm64-v8a \
            --debug

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glow-Ball-APK
          path: "**/*.apk"
          if-no-files-found: error
